<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Offline AI Assistant</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ea; --text: #1a1c1e;
      --muted: #6b7280; --user: #2563eb; --user-text: #ffffff;
      --assistant: #f0f2f5; --accent: #10b981; --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --panel: #171a1f; --border: #2a2f36; --text: #e6e8eb;
        --muted: #9aa3ad; --user: #2563eb; --user-text: #ffffff;
        --assistant: #21262d; --accent: #10b981; --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      padding: 12px 18px; border-bottom: 1px solid var(--border);
      background: var(--panel); display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .pill {
      font-size: 12px; color: var(--muted); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 10px; display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--accent); }
    .dot.bad { background: var(--danger); }
    .spacer { flex: 1; }
    #offline-note { font-size: 12px; color: var(--muted); }

    #chat {
      flex: 1; overflow-y: auto; padding: 22px 18px;
      display: flex; flex-direction: column; gap: 16px;
      max-width: 820px; width: 100%; margin: 0 auto;
    }
    .msg { display: flex; flex-direction: column; gap: 4px; max-width: 85%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 11px 14px; border-radius: 14px; line-height: 1.5;
      white-space: pre-wrap; word-wrap: break-word; font-size: 15px;
    }
    .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant .bubble { background: var(--assistant); border-bottom-left-radius: 4px; }
    .metrics {
      font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums;
      display: flex; gap: 12px; flex-wrap: wrap; padding: 0 4px;
    }
    .metrics b { color: var(--text); font-weight: 600; }
    .cursor::after { content: "▌"; animation: blink 1s steps(1) infinite; color: var(--muted); }
    @keyframes blink { 50% { opacity: 0; } }
    .error .bubble { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

    footer {
      border-top: 1px solid var(--border); background: var(--panel); padding: 12px 18px;
    }
    .composer {
      max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    }
    textarea {
      flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
      padding: 11px 13px; font: inherit; font-size: 15px; background: var(--bg);
      color: var(--text); max-height: 160px; min-height: 46px; outline: none;
    }
    textarea:focus { border-color: var(--user); }
    button {
      border: none; background: var(--user); color: #fff; font: inherit; font-weight: 600;
      padding: 0 18px; height: 46px; border-radius: 12px; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .iconbtn { background: var(--assistant); color: var(--text); padding: 0 14px; font-size: 18px; }
    .iconbtn.recording { background: var(--danger); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }
    .sep { color: var(--border); }
    .hint { max-width: 820px; margin: 6px auto 0; font-size: 11px; color: var(--muted); }
    .speaking { font-size: 11px; color: var(--accent); padding: 0 4px; display: flex; align-items: center; gap: 5px; }

    .browse { max-width: 820px; margin: 0 auto 10px; border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--panel); }
    .browse-head { display: flex; gap: 8px; }
    .browse-head input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; background: var(--bg); color: var(--text); outline: none; }
    .browse-head input:focus { border-color: var(--user); }
    .browse-head button { height: 38px; padding: 0 14px; font-size: 14px; }
    .browse-roots { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .browse-results { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
    .frow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
    .frow:hover { background: var(--bg); }
    .frow .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .frow .fmeta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .frow .fadd { height: 28px; padding: 0 12px; font-size: 12px; }
    .frow .fadd.added { background: var(--accent); }
    .browse-empty { font-size: 12px; color: var(--muted); padding: 6px 8px; }
    .opened-file { font-size: 11.5px; color: var(--accent); padding: 0 4px 2px; font-weight: 600; }

    .tools {
      max-width: 820px; margin: 0 auto 10px; display: flex; align-items: center;
      gap: 14px; flex-wrap: wrap; font-size: 13px;
    }
    .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .toggle input { width: 15px; height: 15px; accent-color: var(--user); }
    .upload {
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; background: var(--bg);
    }
    .upload:hover { border-color: var(--user); }
    .muted { color: var(--muted); }
    .link { background: none; color: var(--user); padding: 0; height: auto; font-size: 13px; text-decoration: underline; }
    .link:hover { opacity: 0.8; }

    .sources { padding: 0 4px; display: flex; flex-direction: column; gap: 3px; }
    .sources-title { font-size: 11px; color: var(--muted); font-weight: 600; }
    .source {
      font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: baseline;
    }
    .source .tag {
      color: var(--user); font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .source .name { color: var(--text); }
    .source .score { margin-left: auto; opacity: 0.7; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>🔒 Local Offline AI Assistant</h1>
    <span class="pill"><span id="status-dot" class="dot"></span><span id="model-name">connecting…</span></span>
    <div class="spacer"></div>
    <span id="offline-note">no data leaves this machine</span>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="tools">
      <label class="toggle">
        <input type="checkbox" id="use-rag" />
        <span>Use my documents</span>
      </label>
      <label class="upload">
        📎 Upload
        <input type="file" id="file" accept=".txt,.md,.pdf,.docx" hidden />
      </label>
      <button id="browse-toggle" class="upload">📁 Local files</button>
      <span id="doc-count" class="muted">no documents loaded</span>
      <button id="clear-docs" class="link" hidden>clear</button>
      <span class="sep">·</span>
      <label class="toggle">
        <input type="checkbox" id="allow-files" checked />
        <span>📂 Open my files</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="speak-replies" checked />
        <span>🔊 Speak replies</span>
      </label>
    </div>

    <div id="browse-panel" class="browse" hidden>
      <div class="browse-head">
        <input id="browse-query" type="text" placeholder="Search your files by name (e.g. resume, invoice)…" />
        <button id="browse-search">Search</button>
      </div>
      <div id="browse-roots" class="browse-roots"></div>
      <div id="browse-results" class="browse-results"></div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="Ask anything… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button id="mic" class="iconbtn" title="Hold a message by voice — click to start/stop recording">🎤</button>
      <button id="send">Send</button>
    </div>
    <div class="hint">Running locally via Ollama · conversation stays in your browser</div>
  </footer>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");
    const statusDot = document.getElementById("status-dot");
    const modelName = document.getElementById("model-name");
    const useRagEl = document.getElementById("use-rag");
    const fileEl = document.getElementById("file");
    const docCountEl = document.getElementById("doc-count");
    const clearDocsEl = document.getElementById("clear-docs");
    const micEl = document.getElementById("mic");
    const speakEl = document.getElementById("speak-replies");
    const allowFilesEl = document.getElementById("allow-files");
    const browseToggleEl = document.getElementById("browse-toggle");
    const browsePanelEl = document.getElementById("browse-panel");
    const browseQueryEl = document.getElementById("browse-query");
    const browseSearchEl = document.getElementById("browse-search");
    const browseRootsEl = document.getElementById("browse-roots");
    const browseResultsEl = document.getElementById("browse-results");

    // Full conversation, sent to the server on every turn (stateless backend).
    const history = [];
    let streaming = false;

    // ── header: engine/model status ──────────────────────────────
    async function loadInfo() {
      try {
        const r = await fetch("/api/info");
        const info = await r.json();
        modelName.textContent = info.model || "unknown";
        statusDot.className = "dot " + (info.healthy ? "ok" : "bad");
        if (!info.healthy) modelName.textContent = "engine offline";
      } catch {
        statusDot.className = "dot bad";
        modelName.textContent = "backend unreachable";
      }
    }

    // ── documents (RAG) ──────────────────────────────────────────
    async function refreshDocs() {
      try {
        const r = await fetch("/api/documents");
        const d = await r.json();
        if (d.count > 0) {
          const names = d.documents.map((x) => x.source).join(", ");
          docCountEl.textContent = `${d.count} chunks from: ${names}`;
          clearDocsEl.hidden = false;
        } else {
          docCountEl.textContent = "no documents loaded";
          clearDocsEl.hidden = true;
        }
      } catch {
        docCountEl.textContent = "documents unavailable";
      }
    }

    async function uploadFile(file) {
      docCountEl.textContent = `embedding ${file.name}…`;
      const form = new FormData();
      form.append("file", file);
      try {
        const r = await fetch("/api/ingest", { method: "POST", body: form });
        const res = await r.json();
        if (!res.ok) {
          docCountEl.textContent = "upload failed: " + (res.error || "unknown");
          return;
        }
        useRagEl.checked = true; // once a doc is loaded, default to using it
        await refreshDocs();
      } catch (err) {
        docCountEl.textContent = "upload error: " + err;
      }
    }

    fileEl.addEventListener("change", () => {
      if (fileEl.files.length) uploadFile(fileEl.files[0]);
      fileEl.value = "";
    });
    clearDocsEl.addEventListener("click", async () => {
      await fetch("/api/rag/reset", { method: "POST" });
      useRagEl.checked = false;
      refreshDocs();
    });

    // ── browse local files (allowlisted) ─────────────────────────
    async function loadRoots() {
      try {
        const r = await fetch("/api/files/roots");
        const d = await r.json();
        browseRootsEl.textContent = d.roots.length
          ? "Searching: " + d.roots.map((x) => x.name).join(", ")
          : "No accessible folders configured.";
      } catch {
        browseRootsEl.textContent = "";
      }
    }

    function fileRow(f) {
      const row = document.createElement("div");
      row.className = "frow";
      const name = document.createElement("span");
      name.className = "fname";
      name.textContent = f.name;
      name.title = f.path;
      const meta = document.createElement("span");
      meta.className = "fmeta";
      meta.textContent = `${f.root} · ${f.size_kb} KB · ${f.modified}`;
      const add = document.createElement("button");
      add.className = "fadd";
      add.textContent = "Add";
      add.addEventListener("click", async () => {
        add.disabled = true;
        add.textContent = "adding…";
        try {
          const r = await fetch("/api/files/ingest", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ path: f.path }),
          });
          const res = await r.json();
          if (res.ok) {
            add.textContent = `added (${res.chunks})`;
            add.classList.add("added");
            useRagEl.checked = true;
            refreshDocs();
          } else {
            add.textContent = "failed";
            add.title = res.error || "";
            add.disabled = false;
          }
        } catch {
          add.textContent = "error";
          add.disabled = false;
        }
      });
      row.append(name, meta, add);
      return row;
    }

    async function runBrowseSearch() {
      const q = browseQueryEl.value.trim();
      browseResultsEl.innerHTML = '<div class="browse-empty">searching…</div>';
      try {
        const r = await fetch("/api/files/search?q=" + encodeURIComponent(q));
        const d = await r.json();
        browseResultsEl.innerHTML = "";
        if (!d.results.length) {
          browseResultsEl.innerHTML =
            '<div class="browse-empty">No matching files (.pdf, .docx, .txt, .md).</div>';
          return;
        }
        for (const f of d.results) browseResultsEl.appendChild(fileRow(f));
      } catch {
        browseResultsEl.innerHTML =
          '<div class="browse-empty">search failed</div>';
      }
    }

    browseToggleEl.addEventListener("click", () => {
      browsePanelEl.hidden = !browsePanelEl.hidden;
      if (!browsePanelEl.hidden) {
        loadRoots();
        browseQueryEl.focus();
      }
    });
    browseSearchEl.addEventListener("click", runBrowseSearch);
    browseQueryEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); runBrowseSearch(); }
    });

    // ── voice: speak replies (TTS) ───────────────────────────────
    let currentAudio = null;

    async function speak(text, wrap) {
      if (!text.trim()) return;
      const note = document.createElement("div");
      note.className = "speaking";
      note.textContent = "🔊 speaking…";
      wrap.appendChild(note);
      try {
        const r = await fetch("/api/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!r.ok) { note.remove(); return; }
        if (r.headers.get("X-Summarized") === "true")
          note.textContent = "🔊 speaking summary…";
        const blob = await r.blob();
        if (currentAudio) currentAudio.pause();
        currentAudio = new Audio(URL.createObjectURL(blob));
        currentAudio.onended = () => note.remove();
        currentAudio.play().catch(() => note.remove());
      } catch {
        note.remove();
      }
    }

    // ── voice: microphone input (STT) ────────────────────────────
    let mediaRecorder = null;
    let recChunks = [];

    async function toggleMic() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        micEl.title = "Microphone unavailable / permission denied";
        return;
      }
      recChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => recChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        micEl.classList.remove("recording");
        micEl.textContent = "⏳";
        const blob = new Blob(recChunks, { type: "audio/webm" });
        const form = new FormData();
        form.append("file", blob, "rec.webm");
        try {
          const r = await fetch("/api/transcribe", { method: "POST", body: form });
          const res = await r.json();
          micEl.textContent = "🎤";
          if (res.ok && res.text.trim()) {
            inputEl.value = res.text.trim();
            send();
          }
        } catch {
          micEl.textContent = "🎤";
        }
      };
      mediaRecorder.start();
      micEl.classList.add("recording");
      micEl.textContent = "⏹";
    }

    micEl.addEventListener("click", toggleMic);

    // ── DOM helpers ──────────────────────────────────────────────
    function addMessage(role, text) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return { wrap, bubble };
    }

    function renderSources(sources) {
      const box = document.createElement("div");
      box.className = "sources";
      const title = document.createElement("div");
      title.className = "sources-title";
      title.textContent = "📄 Sources";
      box.appendChild(title);
      for (const s of sources) {
        const row = document.createElement("div");
        row.className = "source";
        row.title = s.preview || "";
        row.innerHTML =
          `<span class="tag">[${s.n}]</span>` +
          `<span class="name">${s.source}</span>` +
          `<span class="score">cos ${s.score}</span>`;
        box.appendChild(row);
      }
      return box;
    }

    function fmtMetrics(m) {
      const parts = [];
      if (m.time_to_first_token_s != null)
        parts.push(`<b>${(m.time_to_first_token_s * 1000).toFixed(0)} ms</b> to first token`);
      if (m.tokens_per_second != null)
        parts.push(`<b>${m.tokens_per_second.toFixed(1)}</b> tok/s`);
      if (m.completion_tokens != null)
        parts.push(`<b>${m.completion_tokens}</b> tokens`);
      if (m.total_duration_s != null)
        parts.push(`<b>${m.total_duration_s.toFixed(2)} s</b> total`);
      return parts.join(" · ");
    }

    // ── send a turn ──────────────────────────────────────────────
    async function send() {
      const text = inputEl.value.trim();
      if (!text || streaming) return;
      streaming = true;
      sendEl.disabled = true;
      inputEl.value = "";
      inputEl.style.height = "auto";

      addMessage("user", text);
      history.push({ role: "user", content: text });

      const { wrap, bubble } = addMessage("assistant", "");
      bubble.classList.add("cursor");
      let answer = "";

      try {
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: history,
            use_rag: useRagEl.checked,
            allow_file_access: allowFilesEl.checked,
          }),
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buffer.indexOf("\n")) >= 0) {
            const line = buffer.slice(0, nl).trim();
            buffer = buffer.slice(nl + 1);
            if (!line) continue;
            const evt = JSON.parse(line);
            if (evt.type === "token") {
              answer += evt.text;
              bubble.textContent = answer;
              chatEl.scrollTop = chatEl.scrollHeight;
            } else if (evt.type === "done") {
              bubble.classList.remove("cursor");
              if (evt.opened_file) {
                const of = document.createElement("div");
                of.className = "opened-file";
                of.textContent =
                  `📄 Opened ${evt.opened_file.name} (from ${evt.opened_file.root}, ${evt.opened_file.modified})`;
                wrap.insertBefore(of, bubble);
              }
              if (evt.sources && evt.sources.length) {
                wrap.appendChild(renderSources(evt.sources));
              }
              const metrics = document.createElement("div");
              metrics.className = "metrics";
              metrics.innerHTML = fmtMetrics(evt.metrics);
              wrap.appendChild(metrics);
              if (speakEl.checked && answer.trim()) speak(answer, wrap);
            } else if (evt.type === "error") {
              bubble.classList.remove("cursor");
              wrap.className = "msg error";
              bubble.textContent = "⚠ " + evt.error;
            }
          }
        }
        if (answer) history.push({ role: "assistant", content: answer });
      } catch (err) {
        bubble.classList.remove("cursor");
        wrap.className = "msg error";
        bubble.textContent = "⚠ " + err;
      } finally {
        streaming = false;
        sendEl.disabled = false;
        inputEl.focus();
      }
    }

    // ── input behavior ───────────────────────────────────────────
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });
    sendEl.addEventListener("click", send);

    loadInfo();
    refreshDocs();
    inputEl.focus();
  </script>
</body>
</html>
