[pytest]
testpaths = tests
# Tests that assert facts about *this* computer: which applications are
# installed, that a microphone exists, what the processor is. They are the most
# valuable tests in the suite — every one exists because reading the code found
# nothing and running it on real hardware found the bug — and they are exactly
# the ones a CI runner cannot honestly answer. A build agent has no Spotify, no
# sound card and no Start Menu worth the name, so there they are skipped rather
# than weakened into passing everywhere.
markers =
    machine: depends on this specific machine (installed apps, audio devices)
